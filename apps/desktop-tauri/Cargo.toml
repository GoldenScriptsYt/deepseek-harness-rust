[package]
name = "dsh-desktop-tauri"
description = "Native desktop application: WebView2 window over the in-process Rust Host"
version = "0.2.3"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dsh-cli = { path = "../../rust/crates/dsh-cli" }
serde_json = "1.0.154"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
