[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
