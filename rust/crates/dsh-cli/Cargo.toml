[package]
name = "dsh-cli"
description = "Headless dsh runner in Rust"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dsh-rs"
path = "src/main.rs"

[dependencies]
dsh-attachments = { path = "../dsh-attachments" }
dsh-core = { path = "../dsh-core" }
dsh-llm = { path = "../dsh-llm" }
dsh-llm-deepseek = { path = "../dsh-llm-deepseek" }
dsh-session-format = { path = "../dsh-session-format" }
dsh-session-persistence = { path = "../dsh-session-persistence" }
dsh-skills = { path = "../dsh-skills" }
dsh-planning = { path = "../dsh-planning" }
dsh-gateway = { path = "../dsh-gateway" }
dsh-mcp = { path = "../dsh-mcp" }
dsh-tools = { path = "../dsh-tools" }
dsh-web = { path = "../dsh-web" }
serde_json.workspace = true
serde.workspace = true
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
form_urlencoded = "1.2"
chrono-tz = "0.10"
rand = "0.9"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
