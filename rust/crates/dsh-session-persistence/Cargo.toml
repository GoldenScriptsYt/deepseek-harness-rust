[package]
name = "dsh-session-persistence"
description = "File-backed Session store over the DSH JSONL log format"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dsh-session-format = { path = "../dsh-session-format" }
serde_json.workspace = true
thiserror.workspace = true
zstd = { version = "0.13.3", default-features = false }
zstd-safe = { version = "7.4.1", default-features = false }

[target.'cfg(unix)'.dependencies]
fs2 = "0.4.3"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27"
