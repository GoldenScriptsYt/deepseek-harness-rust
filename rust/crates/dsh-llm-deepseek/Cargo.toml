[package]
name = "dsh-llm-deepseek"
description = "DeepSeek Messages-protocol adapter: SSE decoding, stream translation, request serialization"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dsh-llm = { path = "../dsh-llm" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
base64 = "0.22"
httpdate = "1"
unicode-segmentation = "1"
